<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbetim</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 250px; }
    </style>
</head>
<body>

    <div id="login">
        <h2>Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button onclick="kayitOl()">Kaydol</button>
        <button onclick="girisYap()">Giriş Yap</button>
    </div>

    <div id="chat" style="display:none;">
        <h2>Sohbet Odası</h2>
        <button onclick="location.reload()">Çıkış Yap</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeIwGfi_IQuiqzFyv6FvmgmdRocEDT_BI",
            authDomain: "okul-sohbet-45e51.firebaseapp.com",
            projectId: "okul-sohbet-45e51",
            storageBucket: "okul-sohbet-45e51.firebasestorage.app",
            messagingSenderId: "143291075618",
            appId: "1:143291075618:web:6ac0eb7f8e05dab8fd8e7b"
        };

        const auth = getAuth(initializeApp(firebaseConfig));

        window.kayitOl = () => {
            const e = document.getElementById("email").value;
            const p = document.getElementById("pass").value;
            createUserWithEmailAndPassword(auth, e, p)
                .then(() => alert("Kayıt tamam! Şimdi giriş yapabilirsin."))
                .catch(err => alert("Hata: " + err.message));
        };

        window.girisYap = () => {
            const e = document.getElementById("email").value;
            const p = document.getElementById("pass").value;
            signInWithEmailAndPassword(auth, e, p)
                .then(() => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("chat").style.display = "block";
                })
                .catch(err => alert("Hata: " + err.message));
        };
    </script>
</body>
</html>
