<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbetim</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 250px; }
        #chatBox { border: 1px solid #ccc; height: 300px; overflow-y: scroll; margin: 10px auto; width: 300px; text-align: left; padding: 10px; }
    </style>
</head>
<body>

    <div id="login">
        <h2>Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button onclick="kayitOl()">Kaydol</button>
        <button onclick="girisYap()">Giriş Yap</button>
    </div>

    <div id="chat" style="display:none;">
        <h2>Sohbet Odası</h2>
        <div id="chatBox"></div>
        <input id="msg" placeholder="Mesajını yaz...">
        <button onclick="mesajGonder()">Gönder</button>
        <button onclick="location.reload()">Çıkış</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeIwGfi_IQuiqzFyv6FvmgmdRocEDT_BI",
            authDomain: "okul-sohbet-45e51.firebaseapp.com",
            projectId: "okul-sohbet-45e51",
            storageBucket: "okul-sohbet-45e51.firebasestorage.app",
            messagingSenderId: "143291075618",
            appId: "1:143291075618:web:6ac0eb7f8e05dab8fd8e7b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.kayitOl = () => createUserWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pass").value).then(() => alert("Kayıt tamam!")).catch(e => alert(e.message));

        window.girisYap = () => {
            signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pass").value)
                .then(() => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("chat").style.display = "block";
                    mesajlariGetir();
                })
                .catch(e => alert(e.message));
        };

        window.mesajGonder = () => {
            const metin = document.getElementById("msg").value;
            addDoc(collection(db, "mesajlar"), { metin: metin, zaman: Date.now() });
            document.getElementById("msg").value = "";
        };

        function mesajlariGetir() {
            onSnapshot(query(collection(db, "mesajlar"), orderBy("zaman")), (snapshot) => {
                const chatBox = document.getElementById("chatBox");
                chatBox.innerHTML = "";
                snapshot.forEach(doc => {
                    chatBox.innerHTML += `<p>${doc.data().metin}</p>`;
                });
            });
        }
    </script>
</body>
</html>
